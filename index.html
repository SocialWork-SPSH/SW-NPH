<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบงานสังคมสงเคราะห์ รพ.นครปฐม</title><link rel="icon" type="image/png" href="https://i.ibb.co/0yR83GK2/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --c-service: #0b5e47;   /* สีหัวระบบ 1 */
    --c-welfare: #0f766e;   /* สีหัวระบบ 2 (teal) */
    --ink: #1f2d27;
    --muted: #5b6b64;
    --line: #dfe5e2;
    --chip: #eef2f0;
    --bar-h: 40px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Sarabun', sans-serif;
    background: #f4f6f5;
    display: flex;
    flex-direction: column;
  }

  /* ---------- แถบบนแบบบาง แถวเดียว ---------- */
  .bar {
    height: var(--bar-h);
    flex-shrink: 0;
    background: #fff;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px;
    transition: margin-top .2s ease;
  }
  body.collapsed .bar { margin-top: calc(var(--bar-h) * -1); }

  .brand { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }

  .tabs {
    display: flex;
    background: var(--chip);
    border-radius: 8px;
    padding: 3px;
    gap: 3px;
    margin: 0 auto;
  }
  .tabs button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    border: 0; border-radius: 6px; cursor: pointer;
    padding: 4px 14px;
    background: transparent; color: var(--muted);
    white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .tabs button:hover { background: #e2e8e5; color: var(--ink); }
  [data-tab="service"].active { background: var(--c-service); color: #fff; }
  [data-tab="welfare"].active { background: var(--c-welfare); color: #fff; }

  .icon-btn {
    width: 28px; height: 28px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--muted); text-decoration: none;
    font-size: 15px;
  }
  .icon-btn:hover { background: var(--chip); color: var(--ink); }
  .actions { display: flex; gap: 2px; }

  /* ---------- ปุ่มลอยตอนซ่อนแถบ ---------- */
  .float {
    position: fixed; left: 10px; bottom: 10px; z-index: 10;
    display: none; align-items: center; gap: 2px;
    background: #fff; color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px; padding: 3px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    opacity: .55; transition: opacity .15s;
  }
  .float:hover { opacity: 1; }
  body.collapsed .float { display: flex; }
  .float button {
    font-family: inherit; font-size: 13px; font-weight: 600;
    border: 0; border-radius: 999px; cursor: pointer;
    padding: 4px 10px; background: transparent; color: var(--muted);
  }

  /* ---------- พื้นที่ระบบ ---------- */
  main { flex: 1; position: relative; }
  .pane { position: absolute; inset: 0; display: none; }
  .pane.active { display: block; }
  .pane iframe { width: 100%; height: 100%; border: 0; display: block; }
  .loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #567; pointer-events: none;
  }

  @media (max-width: 760px) {
    .brand { display: none; }
    .tabs { margin: 0; flex: 1; }
    .tabs button { flex: 1; padding: 4px 6px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="bar">
  <span class="brand">งานสังคมสงเคราะห์ รพ.นครปฐม</span>
  <div class="tabs">
    <button data-tab="service">บันทึกการให้บริการ</button>
    <button data-tab="welfare">อนุเคราะห์ / ค้างชำระ</button>
  </div>
  <div class="actions">
    <a id="openNew" class="icon-btn" href="#" target="_blank" rel="noopener" title="เปิดระบบนี้ในแท็บใหม่">↗</a>
    <button id="collapse" class="icon-btn" title="ซ่อนแถบด้านบน">⌃</button>
  </div>
</div>

<div class="float" title="สลับระบบ">
  <button data-tab="service">① ให้บริการ</button>
  <button data-tab="welfare">② อนุเคราะห์</button>
  <button id="expand" title="แสดงแถบด้านบน">⌄</button>
</div>

<main>
  <div class="pane" id="pane-service">
    <div class="loading">กำลังโหลดระบบ…</div>
    <iframe data-src="https://script.google.com/macros/s/AKfycbyCPHzub-5ycPE9iZi4FWZfHtEyP7diT5YytCBLOGJhHNfr7gYoqa0Uc7dQWeG302_Kkg/exec"
            title="ระบบบันทึกการให้บริการสังคมสงเคราะห์"
            allow="clipboard-write; fullscreen"></iframe>
  </div>
  <div class="pane" id="pane-welfare">
    <div class="loading">กำลังโหลดระบบ…</div>
    <iframe data-src="https://script.google.com/macros/s/AKfycbwdN3J-0G8lAxPAnIChGQ5O6LfncJNXw4UdqYgpnef9HC4M33s2a11uCCTI25hQVVuANQ/exec"
            title="ระบบบันทึกผู้ใช้บริการสงเคราะห์"
            allow="clipboard-write; fullscreen"></iframe>
  </div>
</main>

<script>
  const tabButtons = document.querySelectorAll('[data-tab]');
  const openNew = document.getElementById('openNew');

  let currentTab = 'service';

  // เติม embed=1 ให้ระบบรู้ว่ากำลังถูกฝังอยู่ในหน้ารวม
  function embedUrl(href) {
    const u = new URL(href);
    u.searchParams.set('embed', '1');
    return u.toString();
  }
  // ลิงก์ "เปิดในแท็บใหม่" = หน้าปัจจุบันของระบบ แต่ไม่มี embed
  function plainUrl(href) {
    const u = new URL(href);
    u.searchParams.delete('embed');
    return u.toString();
  }

  function show(tab) {
    if (!document.getElementById('pane-' + tab)) tab = 'service';
    currentTab = tab;
    tabButtons.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));

    const pane = document.getElementById('pane-' + tab);
    const frame = pane.querySelector('iframe');
    if (!frame.getAttribute('src')) {
      frame.addEventListener('load', () => pane.querySelector('.loading')?.remove(), { once: true });
      frame.dataset.current = frame.dataset.src;
      frame.src = embedUrl(frame.dataset.src);
    }
    pane.classList.add('active');
    openNew.href = plainUrl(frame.dataset.current);
    history.replaceState(null, '', '#' + tab);
  }

  // รับคำสั่งเปลี่ยนหน้าจากระบบที่ฝังอยู่ (ค้นหา / ติดตามชำระเงิน / Dashboard / กลับหน้าบันทึก)
  window.addEventListener('message', (e) => {
    if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
    const d = e.data;
    if (!d || d.type !== 'sw-nav' || typeof d.href !== 'string') return;

    for (const frame of document.querySelectorAll('.pane iframe')) {
      const base = frame.dataset.src.split('?')[0];
      if (d.href.startsWith(base)) {
        frame.dataset.current = d.href;
        frame.src = embedUrl(d.href);
        if (frame.closest('.pane').classList.contains('active')) openNew.href = plainUrl(d.href);
        return;
      }
    }
  });
  tabButtons.forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));

  // ซ่อน/แสดงแถบด้านบน (จำค่าไว้ในเครื่อง)
  function setCollapsed(on) {
    document.body.classList.toggle('collapsed', on);
    try { localStorage.setItem('swBarCollapsed', on ? '1' : '0'); } catch (e) {}
  }
  document.getElementById('collapse').addEventListener('click', () => setCollapsed(true));
  document.getElementById('expand').addEventListener('click', () => setCollapsed(false));
  try { if (localStorage.getItem('swBarCollapsed') === '1') setCollapsed(true); } catch (e) {}

  show(location.hash.replace('#', '') || 'service');
</script>
</body>
</html>
